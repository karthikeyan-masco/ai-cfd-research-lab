[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cfd-lab"
version = "0.1.0"
description = "Debate-driven AI research prototype for compressible CFD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["httpx>=0.25"]
ui = ["streamlit>=1.32"]
dev = ["pytest>=8"]

[project.scripts]
ai-cfd-lab = "ai_cfd_lab.cli:main"
ai-cfd-benchmark = "ai_cfd_lab.benchmarks.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_cfd_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
